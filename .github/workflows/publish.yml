name: publish
# Tag-triggered crates.io release with trusted publishing (OIDC). No long-lived token: configure
# this repository, this workflow and the `crates` environment as a trusted publisher for the
# `cexy` crate on crates.io.
#
# Two jobs: `build` (no OIDC token) verifies the tag, tests and packages; `publish` (OIDC only,
# protected `crates` environment) exchanges the OIDC token for a short-lived crates.io token
# and publishes exactly the reviewed tag.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run: {working-directory: cexy-rust}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-rust, fetch-depth: 0, persist-credentials: false}
      - name: Refuse tags whose commit is not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: cexyio/cexy-api-spec, path: cexy-api-spec, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: {toolchain: stable, components: rustfmt} # generate.py --check formats with rustfmt
      - name: Tag matches Cargo.toml version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.2
      # The release gate repeats CI's checks on the exact tagged commit.
      - name: Generated code matches the spec (drift check)
        run: python3 tools/generate.py --check
      - run: cargo test --locked
        env: {CEXY_REQUIRE_SPEC: "1"}
      - name: Known vulnerabilities (cargo-audit, pinned)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Secret scan (gitleaks 8.21.2, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --no-banner --redact
      - name: No internal references
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: |
          printf '%s\n' "$SCAN_PATTERNS" > "$RUNNER_TEMP/scan-patterns.txt"
          CEXY_SCAN_PATTERNS_FILE="$RUNNER_TEMP/scan-patterns.txt" python3 tools/scan_internal.py .
      - name: Works as a dependency (no dev-dependency features; one offline request over TLS + HTTP/2)
        run: |
          cargo tree -e features -i hyper --edges normal | grep -q 'hyper feature "http2"'
          cargo build --manifest-path ci/consumer/Cargo.toml
          cargo run --manifest-path ci/consumer/Cargo.toml
      - name: Package (and print the file list and checksum)
        run: |
          cargo package --locked
          cargo package --list --locked
          sha256sum target/package/*.crate | sed 's/^/crate sha256 /'

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write # OIDC for crates.io trusted publishing
    defaults:
      run: {working-directory: cexy-rust}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: cexy-rust, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: {toolchain: stable}
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the tagged crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Built and tested in the build job; this job only uploads.
        run: cargo publish --locked --no-verify
